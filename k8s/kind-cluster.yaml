# Local Kubernetes cluster (kind = Kubernetes-in-Docker)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: heart-mlops
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 8088, protocol: TCP}    # ingress -> API
      - {containerPort: 30090, hostPort: 9095, protocol: TCP} # Prometheus
      - {containerPort: 30030, hostPort: 3030, protocol: TCP} # Grafana
